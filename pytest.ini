[pytest]
markers =
    group1: Scenario 1 – clear image (accepted, error within tolerance)
    group2: Scenario 2 – blurry image
    group3: Scenario 3 – tilted image
    group4: Scenario 4 – poorly illuminated image
    group5: Scenario 5 – partially obstructed image
    group6: Scenario 6 – corrupted file and unsupported file
    group7: Scenario 7 – uncertain reading (value_low/value_high present, range > 0)
    group8: Scenario 8 – reading outside calibration bounds (dead zone)
    group9: Scenario 9 – two attempts disagree (readings_agree False)
    group10: Scenario 10 – human verification required (needs_human True, reason non-empty)
